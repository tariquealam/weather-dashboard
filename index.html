<!doctype html><html><body><h1>Weather Dashboard</h1><input id="city" placeholder="Enter city"><button onclick="loadWeather()">Search</button><pre id="result"></pre><script>async function loadWeather(){const c=city.value,g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(c)+'&count=1').then(r=>r.json());if(!g.results){result.textContent='City not found';return}const x=g.results[0],w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+x.latitude+'&longitude='+x.longitude+'&current_weather=true').then(r=>r.json());result.textContent=`${x.name}\nTemperature: ${w.current_weather.temperature}°C\nWind: ${w.current_weather.windspeed} km/h`}</script></body></html>
